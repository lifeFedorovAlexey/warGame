<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="icon" href="data:,">
  <title>Командирский УАЗ · стенд сборки</title>
  <style>
    :root{color-scheme:dark;font:15px/1.5 system-ui,sans-serif;background:#20251f;color:#e5e9df}
    body{margin:0}main{display:grid;grid-template-columns:292px minmax(0,1fr);min-height:100dvh}
    aside{box-sizing:border-box;padding:26px 22px;background:#242a23;border-right:1px solid #444d40}
    .eyebrow{font-size:11px;letter-spacing:.16em;color:#c4bc92}h1{font-size:27px;line-height:1.15;margin:11px 0}
    p{margin:0 0 18px;color:#b9c2b4}a{color:#c9d7bb}.buttons{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0}
    button{font:inherit;color:#e6eddd;background:#333d30;border:1px solid #535f4c;padding:8px 12px;border-radius:4px;cursor:pointer}
    button[aria-pressed="true"]{background:#596749;border-color:#a3b485}button:disabled{opacity:.55;cursor:wait}
    #parts{display:grid;gap:8px;margin:21px 0}.part{padding:10px 12px;border:1px solid #424e3d;border-radius:4px;background:#2d352b}
    .part small{display:block;color:#b8c4b0;font-variant-numeric:tabular-nums}.part b{font-weight:600}
    #view{position:relative;min-height:560px;overflow:hidden}canvas{display:block;width:100%;height:100%;touch-action:none}
    output{display:block;padding:9px 11px;border-radius:4px;background:#343e31;color:#d5e6cc;font-variant-numeric:tabular-nums}
    #hint{position:absolute;bottom:18px;left:20px;color:#e4eadf;background:#283027dc;padding:7px 11px;border-radius:4px;font-size:12px;pointer-events:none}
    #error{color:#ffd1ba;margin-top:14px}
    @media(max-width:700px){main{grid-template-columns:1fr}aside{border-right:0;border-bottom:1px solid #444d40;padding:16px}#parts{grid-template-columns:repeat(3,minmax(0,1fr));gap:5px}#view{min-height:58dvh}.part{padding:6px}.part small{font-size:11px}}
  </style>
  <script type="importmap">{"imports":{"three":"../demo/vendor/three.module.js"}}</script>
<link rel="stylesheet" href="../assets/ui/icons.css">
</head>
<body>
<main>
  <aside>
    <span class="eyebrow">СТЕНД СБОРКИ · КЛАСС S</span>
    <h1>Командирский УАЗ</h1>
    <p>Четыре подушки под кузовом и отдельный сокет радиоблока на крыше.</p>
    <div class="buttons" aria-label="Сборка и разборка">
      <button id="assemble" aria-pressed="true" disabled data-icon="assemble" aria-label="Сборка"></button>
      <button id="explode" aria-pressed="false" disabled data-icon="explode" aria-label="Разборка"></button>
    </div>
    <div class="buttons" aria-label="Камера и движение узлов">
      <button id="front" aria-pressed="true" disabled data-icon="front" aria-label="Спереди"></button>
      <button id="rear" aria-pressed="false" disabled data-icon="rear" aria-label="Сзади"></button>
      <button id="motion" aria-pressed="false" disabled data-icon="engine" aria-label="Движение узлов"></button>
    </div>
    <div id="parts" aria-label="Независимые компоненты"></div>
    <output id="status" aria-live="polite">Загрузка трёх GLB…</output>
    <p id="error" role="alert" hidden></p>
  </aside>
  <section id="view" aria-label="Трёхмерная сборка">
    <span id="hint">Вращение мышью · приближение колёсиком</span>
  </section>
</main>
<script type="module" src="command-review.js"></script>
<script type="module" src="../assets/ui/icons.js"></script>
</body>
</html>
